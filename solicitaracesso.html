<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Liberação de Escala</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f172a;
}

#webviewEscala {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: none;

    display: block;

}

</style>

</head>


<body>


<iframe
    id="webviewEscala"
    allow="clipboard-read; clipboard-write"
    loading="eager">
</iframe>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_APPS_SCRIPT =
    "https://script.google.com/a/*/macros/s/AKfycbzJh49CVpD4cApIFxo8B-3th3LSAAl6E-i3OEAERwMUwdyjTsjJ5lamwE2iDTSvkowF/exec?page=liberarescala";


/* =====================================================
   CARREGAR
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        const iframe =
            document.getElementById(
                "webviewEscala"
            );

        if (!iframe) {
            return;
        }


        /*
         * Usuário vindo da URL do GitHub
         */

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const idURL =
            parametros.get(
                "idUsuario"
            );


        const nomeURL =
            parametros.get(
                "nome"
            );


        /*
         * Salva no localStorage do GitHub
         */

        if (idURL) {

            localStorage.setItem(
                "usuarioId",
                idURL
            );

        }


        if (nomeURL) {

            localStorage.setItem(
                "nomeUsuario",
                nomeURL
            );

        }


        /*
         * Recupera caso não tenha vindo
         * pela URL.
         */

        const idUsuario =
            idURL ||
            localStorage.getItem(
                "usuarioId"
            ) ||
            "";


        const nome =
            nomeURL ||
            localStorage.getItem(
                "nomeUsuario"
            ) ||
            "";


        /*
         * IMPORTANTE:
         *
         * A página do Apps Script também
         * precisa receber o ID e o nome,
         * pois o localStorage do GitHub
         * é diferente do localStorage
         * do Apps Script.
         */

        let url =
            URL_APPS_SCRIPT;


        if (idUsuario) {

            url +=
                "&idUsuario=" +
                encodeURIComponent(
                    idUsuario
                );

        }


        if (nome) {

            url +=
                "&nome=" +
                encodeURIComponent(
                    nome
                );

        }


        console.log(
            "Abrindo tela de liberação:",
            url
        );


        iframe.src =
            url;

    }
);

</script>


</body>

</html>

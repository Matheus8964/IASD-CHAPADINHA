<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Espaço para Criar Escalas</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {

    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.55)
        ),
        url(
            "https://images.unsplash.com/photo-1457459686225-c7db79d4e59f?q=80&w=1600&auto=format&fit=crop"
        );

    background-size: cover;

    background-position: center;

    background-attachment: fixed;

    color: white;

}


/* =====================================================
   HEADER
===================================================== */

header {

    width: 100%;

    padding:
        18px 25px;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    background:
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid
        rgba(255,255,255,.15);

}


.logo h2 {

    font-size:
        21px;

    font-weight:
        700;

}


.logo span {

    color:
        #ddd;

    font-size:
        12px;

}


.usuario {

    font-size:
        13px;

    font-weight:
        600;

    text-align:
        right;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width:
        100%;

    max-width:
        700px;

    margin:
        0 auto;

    padding:
        30px 15px;

}


/* =====================================================
   CARD PRINCIPAL
===================================================== */

.card {

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:
        20px;

    padding:
        25px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

}


/* =====================================================
   TÍTULO
===================================================== */

.titulo {

    text-align:
        center;

    margin-bottom:
        25px;

}


.titulo h1 {

    font-size:
        25px;

    margin-bottom:
        8px;

}


.titulo p {

    color:
        #ddd;

    font-size:
        13px;

    line-height:
        1.5;

}


/* =====================================================
   WEBVIEW
===================================================== */

.webviewContainer {

    width:
        100%;

    margin-top:
        10px;

    overflow:
        hidden;

    border-radius:
        16px;

    background:
        rgba(0,0,0,.15);

}


.webview {

    display:
        block;

    width:
        100%;

    min-height:
        560px;

    border:
        none;

    background:
        transparent;

}


/* =====================================================
   ACESSO LIBERADO
===================================================== */

#acessoLiberado {

    display:
        none;

    margin-top:
        20px;

    padding:
        20px;

    border-radius:
        16px;

    background:
        rgba(30,120,70,.20);

    border:
        1px solid
        rgba(80,255,150,.35);

    text-align:
        center;

}


#acessoLiberado strong {

    display:
        block;

    font-size:
        17px;

    margin-bottom:
        8px;

}


#acessoLiberado p {

    color:
        #ddd;

    font-size:
        13px;

    line-height:
        1.5;

    margin-bottom:
        15px;

}


/* =====================================================
   BOTÃO
===================================================== */

.btnCriarEscala {

    width:
        100%;

    border:
        none;

    border-radius:
        12px;

    padding:
        14px;

    background:
        white;

    color:
        #222;

    font-size:
        14px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        .2s ease;

}


.btnCriarEscala:hover {

    background:
        #eeeeee;

}


.btnCriarEscala:active {

    transform:
        scale(.98);

}


/* =====================================================
   STATUS
===================================================== */

.statusGitHub {

    margin-top:
        15px;

    text-align:
        center;

    font-size:
        12px;

    color:
        #ddd;

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 600px) {

    header {

        padding:
            15px 18px;

    }


    .logo h2 {

        font-size:
            19px;

    }


    .logo span {

        display:
            none;

    }


    .usuario {

        font-size:
            12px;

    }


    .container {

        padding:
            20px 10px;

    }


    .card {

        padding:
            18px;

    }


    .titulo h1 {

        font-size:
            23px;

    }


    .webview {

        min-height:
            600px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">

        <h2>
            Escala Distrital
        </h2>

        <span>
            IASD Chapadinha
        </span>

    </div>


    <div
        class="usuario"
        id="usuarioNome"
    >

        Carregando...

    </div>

</header>



<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="container">

    <div class="card">


        <div class="titulo">

            <h1>
                📋 Espaço para Criar Escalas
            </h1>

            <p>
                Área destinada aos usuários
                autorizados a criar as escalas
                do distrito.
            </p>

        </div>



        <!-- =================================================
             APPS SCRIPT
        ================================================== -->

        <div class="webviewContainer">

            <iframe
                id="webviewEscala"
                class="webview"
                allow="clipboard-read; clipboard-write"
                loading="eager"
            ></iframe>

        </div>



        <!-- =================================================
             ACESSO LIBERADO
        ================================================== -->

        <div id="acessoLiberado">

            <strong>
                ✅ Acesso liberado
            </strong>

            <p>
                Seu usuário está autorizado.
                Agora você pode acessar as
                funções de criação de escalas.
            </p>


            <button
                type="button"
                class="btnCriarEscala"
                onclick="acessarFuncoesDesenvolvedor()"
            >

                📋 Acessar funções de criação

            </button>

        </div>



        <!-- =================================================
             STATUS
        ================================================== -->

        <div
            id="statusGitHub"
            class="statusGitHub"
        >

            🔄 Verificando autorização...

        </div>


    </div>

</main>



<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_APPS_SCRIPT =
    "https://script.google.com/a/*/macros/s/AKfycbzJh49CVpD4cApIFxo8B-3th3LSAAl6E-i3OEAERwMUwdyjTsjJ5lamwE2iDTSvkowF/exec?page=liberarescala";

const ORIGEM_APPS_SCRIPT =
    "https://script.google.com";


/* =====================================================
   USUÁRIO
===================================================== */

let usuario = {

    idUsuario:
        "",

    nome:
        ""

};


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        carregarUsuario();

        prepararIframe();

    }
);


/* =====================================================
   CARREGAR USUÁRIO
===================================================== */

function carregarUsuario() {

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    /*
     * Primeiro tenta os dados enviados
     * pelo login.
     */

    const idURL =
        parametros.get(
            "idUsuario"
        );


    const nomeURL =
        parametros.get(
            "nome"
        );


    /*
     * Se vieram pela URL,
     * salva no GitHub.
     */

    if (idURL) {

        localStorage.setItem(
            "usuarioId",
            idURL
        );

        usuario.idUsuario =
            idURL;

    }


    if (nomeURL) {

        localStorage.setItem(
            "nomeUsuario",
            nomeURL
        );

        usuario.nome =
            nomeURL;

    }


    /*
     * Se não vieram pela URL,
     * tenta localStorage.
     */

    if (!usuario.idUsuario) {

        usuario.idUsuario =
            localStorage.getItem(
                "usuarioId"
            ) || "";

    }


    if (!usuario.nome) {

        usuario.nome =
            localStorage.getItem(
                "nomeUsuario"
            ) || "";

    }


    /*
     * Mostrar nome.
     */

    const elemento =
        document.getElementById(
            "usuarioNome"
        );


    if (elemento) {

        elemento.innerText =
            usuario.nome
                ? "👤 " + usuario.nome
                : "👤 Usuário";

    }


    console.log(
        "Usuário no GitHub:",
        usuario
    );

}


/* =====================================================
   PREPARAR IFRAME
===================================================== */

function prepararIframe() {

    const iframe =
        document.getElementById(
            "webviewEscala"
        );


    if (!iframe) {

        return;

    }


    /*
     * IMPORTANTE:
     *
     * O Apps Script não consegue acessar
     * o localStorage do GitHub porque são
     * origens diferentes.
     *
     * Por isso enviamos o ID e o nome
     * diretamente na URL.
     */

    const parametros =
        new URLSearchParams();


    if (usuario.idUsuario) {

        parametros.set(
            "idUsuario",
            usuario.idUsuario
        );

    }


    if (usuario.nome) {

        parametros.set(
            "nome",
            usuario.nome
        );

    }


    const url =
        URL_APPS_SCRIPT +
        "?page=criarEscala" +
        (
            parametros.toString()
                ? "&" + parametros.toString()
                : ""
        );


    console.log(
        "Abrindo Apps Script:",
        url
    );


    iframe.src =
        url;

}


/* =====================================================
   RECEBER MENSAGEM DO APPS SCRIPT
===================================================== */

window.addEventListener(
    "message",
    function(event) {

        console.log(
            "Mensagem recebida:",
            event.origin,
            event.data
        );


        /*
         * Aceita somente mensagens
         * vindas do Apps Script.
         */

        if (
            event.origin !==
            "https://script.google.com"
        ) {

            return;

        }


        if (!event.data) {

            return;

        }


        if (
            event.data.tipo !==
            "STATUS_ACESSO_ESCALA"
        ) {

            return;

        }


        /*
         * Confirma o usuário.
         */

        if (
            usuario.idUsuario &&
            event.data.idUsuario &&
            String(
                event.data.idUsuario
            ) !==
            String(
                usuario.idUsuario
            )
        ) {

            console.warn(
                "Mensagem ignorada: usuário diferente."
            );

            return;

        }


        const status =
            String(
                event.data.status ||
                ""
            ).toLowerCase();


        /*
         * =========================================
         * LIBERADO
         * =========================================
         */

        if (
            status ===
            "unblock"
        ) {

            mostrarAcessoLiberado();

            return;

        }


        /*
         * =========================================
         * BLOQUEADO
         * =========================================
         */

        if (
            status ===
            "block"
        ) {

            mostrarAcessoBloqueado();

            return;

        }

    }
);


/* =====================================================
   MOSTRAR ACESSO LIBERADO
===================================================== */

function mostrarAcessoLiberado() {

    const area =
        document.getElementById(
            "acessoLiberado"
        );


    const status =
        document.getElementById(
            "statusGitHub"
        );


    if (area) {

        area.style.display =
            "block";

    }


    if (status) {

        status.innerText =
            "✅ Autorização confirmada.";

    }


    console.log(
        "GITHUB: ACESSO LIBERADO"
    );

}


/* =====================================================
   MOSTRAR ACESSO BLOQUEADO
===================================================== */

function mostrarAcessoBloqueado() {

    const area =
        document.getElementById(
            "acessoLiberado"
        );


    const status =
        document.getElementById(
            "statusGitHub"
        );


    if (area) {

        area.style.display =
            "none";

    }


    if (status) {

        status.innerText =
            "🔒 Usuário sem autorização para criar escalas.";

    }


    console.log(
        "GITHUB: ACESSO BLOQUEADO"
    );

}


/* =====================================================
   ACESSAR FUNÇÕES DE DESENVOLVEDOR
===================================================== */

function acessarFuncoesDesenvolvedor() {

    const parametros =
        new URLSearchParams();


    if (usuario.idUsuario) {

        parametros.set(
            "idUsuario",
            usuario.idUsuario
        );

    }


    if (usuario.nome) {

        parametros.set(
            "nome",
            usuario.nome
        );

    }


    const url =
        "./criarEscalaFuncoes.html" +
        (
            parametros.toString()
                ? "?" + parametros.toString()
                : ""
        );


    console.log(
        "Abrindo funções de criação:",
        url
    );


    window.location.href =
        url;

}

</script>


</body>

</html>

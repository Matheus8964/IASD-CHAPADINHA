<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Espaço para Criar Escalas</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    background: #0f172a;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   IFRAME
===================================================== */

#webviewEscala {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: none;

    display: block;

}


/* =====================================================
   ÁREA DO BOTÃO
===================================================== */

#areaBotao {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    padding: 15px;

    background:
        rgba(15, 23, 42, .97);

    border-top:
        1px solid
        rgba(255,255,255,.12);

    display: none;

    z-index: 9999;

}


/* =====================================================
   BOTÃO
===================================================== */

#btnCriarEscala {

    width: 100%;

    max-width: 600px;

    display: block;

    margin: 0 auto;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #ffffff;

    color: #0f172a;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

}


#btnCriarEscala:active {

    transform: scale(.98);

}


/* =====================================================
   STATUS
===================================================== */

#status {

    position: fixed;

    left: 50%;

    top: 10px;

    transform:
        translateX(-50%);

    z-index: 10000;

    padding:
        8px 14px;

    border-radius:
        20px;

    background:
        rgba(0,0,0,.65);

    color:
        white;

    font-size:
        12px;

    display:
        none;

}

</style>

</head>


<body>


<!-- =====================================================
     TELA DE LIBERAÇÃO DO APPS SCRIPT
===================================================== -->

<iframe
    id="webviewEscala"
    allow="clipboard-read; clipboard-write"
    loading="eager">
</iframe>



<!-- =====================================================
     STATUS
===================================================== -->

<div id="status">
    Verificando autorização...
</div>



<!-- =====================================================
     BOTÃO
===================================================== -->

<div id="areaBotao">

    <button
        id="btnCriarEscala"
        onclick="abrirCriacaoEscala()"
    >

        📋 Criar Nova Escala

    </button>

</div>



<script>

/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const URL_APPS_SCRIPT =
    "https://script.google.com/a/*/macros/s/AKfycbzJh49CVpD4cApIFxo8B-3th3LSAAl6E-i3OEAERwMUwdyjTsjJ5lamwE2iDTSvkowF/exec";


/*
 * Página que verifica a autorização.
 */

const URL_LIBERACAO =
    URL_APPS_SCRIPT +
    "?page=liberarescala";


/*
 * Página que será aberta quando
 * o usuário estiver autorizado.
 *
 * ALTERE SOMENTE SE O NOME DA SUA
 * PÁGINA DE CRIAÇÃO FOR DIFERENTE.
 */

const URL_CRIAR_ESCALA =
    "./criarEscala.html";


/* =====================================================
   USUÁRIO
===================================================== */

let usuario = {

    idUsuario: "",

    nome: ""

};


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        carregarUsuario();

        carregarTelaLiberacao();

    }
);


/* =====================================================
   CARREGAR USUÁRIO
===================================================== */

function carregarUsuario() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const idURL =
        params.get("idUsuario");


    const nomeURL =
        params.get("nome");


    /*
     * URL tem prioridade.
     */

    if (idURL) {

        usuario.idUsuario =
            idURL;

        localStorage.setItem(
            "usuarioId",
            idURL
        );

    }
    else {

        usuario.idUsuario =
            localStorage.getItem(
                "usuarioId"
            ) || "";

    }


    if (nomeURL) {

        usuario.nome =
            nomeURL;

        localStorage.setItem(
            "nomeUsuario",
            nomeURL
        );

    }
    else {

        usuario.nome =
            localStorage.getItem(
                "nomeUsuario"
            ) || "";

    }


    console.log(
        "Usuário carregado no GitHub:",
        usuario
    );

}


/* =====================================================
   CARREGAR TELA DE LIBERAÇÃO
===================================================== */

function carregarTelaLiberacao() {

    const iframe =
        document.getElementById(
            "webviewEscala"
        );


    if (!iframe) {

        return;

    }


    let url =
        URL_LIBERACAO;


    /*
     * Passa o ID do usuário para
     * o Apps Script.
     */

    if (usuario.idUsuario) {

        url +=
            "&idUsuario=" +
            encodeURIComponent(
                usuario.idUsuario
            );

    }


    /*
     * Passa o nome também.
     */

    if (usuario.nome) {

        url +=
            "&nome=" +
            encodeURIComponent(
                usuario.nome
            );

    }


    console.log(
        "Abrindo tela de liberação:",
        url
    );


    iframe.src =
        url;

}


/* =====================================================
   RECEBER POSTMESSAGE DO APPS SCRIPT
===================================================== */

window.addEventListener(
    "message",
    function(event) {

        console.log(
            "Mensagem recebida do Apps Script:",
            event.data
        );


        /*
         * Verifica se existe mensagem.
         */

        if (!event.data) {

            return;

        }


        /*
         * Verifica o tipo.
         */

        if (
            event.data.tipo !==
            "STATUS_ACESSO_ESCALA"
        ) {

            return;

        }


        const status =
            String(
                event.data.status || ""
            ).toLowerCase();


        const idRecebido =
            String(
                event.data.idUsuario || ""
            );


        console.log(
            "Status recebido:",
            status
        );


        console.log(
            "ID recebido:",
            idRecebido
        );


        /*
         * =================================================
         * ACESSO LIBERADO
         * =================================================
         */

        if (
            status ===
            "unblock"
        ) {

            mostrarBotaoCriarEscala();

            return;

        }


        /*
         * =================================================
         * ACESSO BLOQUEADO
         * =================================================
         */

        if (
            status ===
            "block"
        ) {

            esconderBotaoCriarEscala();

            return;

        }

    }
);


/* =====================================================
   MOSTRAR BOTÃO
===================================================== */

function mostrarBotaoCriarEscala() {

    const area =
        document.getElementById(
            "areaBotao"
        );


    const status =
        document.getElementById(
            "status"
        );


    if (area) {

        area.style.display =
            "block";

    }


    if (status) {

        status.style.display =
            "block";

        status.innerText =
            "✅ Acesso liberado";

        setTimeout(
            function() {

                status.style.display =
                    "none";

            },
            2500
        );

    }


    console.log(
        "BOTÃO DE CRIAR ESCALA LIBERADO."
    );

}


/* =====================================================
   ESCONDER BOTÃO
===================================================== */

function esconderBotaoCriarEscala() {

    const area =
        document.getElementById(
            "areaBotao"
        );


    if (area) {

        area.style.display =
            "none";

    }


    console.log(
        "Acesso para criação bloqueado."
    );

}


/* =====================================================
   ABRIR CRIAÇÃO DE ESCALA
===================================================== */

function abrirCriacaoEscala() {

    const params =
        new URLSearchParams();


    if (usuario.idUsuario) {

        params.set(
            "idUsuario",
            usuario.idUsuario
        );

    }


    if (usuario.nome) {

        params.set(
            "nome",
            usuario.nome
        );

    }


    const url =
        URL_CRIAR_ESCALA +
        "?" +
        params.toString();


    console.log(
        "Abrindo criação de escala:",
        url
    );


    window.location.href =
        url;

}

</script>


</body>

</html>

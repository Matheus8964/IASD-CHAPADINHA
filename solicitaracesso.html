<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Escala Distrital</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #0f172a;

}

iframe {

    width: 100%;
    height: 100%;

    border: none;

    display: block;

}

</style>

</head>


<body>


<iframe
    id="appFrame"
    src="https://script.google.com/a/*/macros/s/AKfycbzJh49CVpD4cApIFxo8B-3th3LSAAl6E-i3OEAERwMUwdyjTsjJ5lamwE2iDTSvkowF/exec?page=login"
    allow="clipboard-read; clipboard-write"
    loading="eager">
</iframe>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_LOGIN =
    "https://script.google.com/a/*/macros/s/AKfycbzJh49CVpD4cApIFxo8B-3th3LSAAl6E-i3OEAERwMUwdyjTsjJ5lamwE2iDTSvkowF/exec?page=login";


/* =====================================================
   GARANTE QUE O LOGIN SEJA CARREGADO
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        const iframe =
            document.getElementById(
                "appFrame"
            );

        if (!iframe) return;

        iframe.src =
            URL_LOGIN;

    }
);

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Liberação de Escala</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height:100vh;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b
        );

    color:#fff;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

/* =========================================
   CONTAINER
========================================= */

.container{

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:24px;

    padding:28px 22px;

    backdrop-filter:blur(15px);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.35);

}

/* =========================================
   CABEÇALHO
========================================= */

.icone{

    width:70px;
    height:70px;

    margin:0 auto 18px;

    border-radius:50%;

    background:#2563eb;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

    box-shadow:
        0 10px 25px rgba(37,99,235,0.35);

}

h1{

    text-align:center;

    font-size:24px;

    margin-bottom:10px;

}

.subtitulo{

    text-align:center;

    color:#cbd5e1;

    font-size:14px;

    line-height:1.5;

    margin-bottom:25px;

}

/* =========================================
   USUÁRIO
========================================= */

.usuario{

    background:rgba(255,255,255,0.06);

    border-radius:15px;

    padding:15px;

    margin-bottom:20px;

    text-align:center;

}

.usuario small{

    display:block;

    color:#94a3b8;

    font-size:12px;

    margin-bottom:5px;

}

.usuario strong{

    font-size:17px;

}

/* =========================================
   STATUS
========================================= */

.status{

    padding:15px;

    border-radius:14px;

    text-align:center;

    font-size:14px;

    line-height:1.5;

    margin-bottom:20px;

}

.status.verificando{

    background:rgba(59,130,246,0.15);

    color:#93c5fd;

}

.status.sucesso{

    background:rgba(34,197,94,0.15);

    color:#86efac;

}

.status.erro{

    background:rgba(239,68,68,0.15);

    color:#fca5a5;

}

/* =========================================
   ÁREA DO CÓDIGO
========================================= */

#areaCodigo{

    display:none;

}

.label{

    display:block;

    color:#cbd5e1;

    font-size:14px;

    margin-bottom:8px;

}

.inputCodigo{

    width:100%;

    height:54px;

    border:none;

    outline:none;

    border-radius:13px;

    background:#fff;

    color:#0f172a;

    text-align:center;

    font-size:25px;

    font-weight:bold;

    letter-spacing:8px;

    margin-bottom:14px;

}

.inputCodigo:focus{

    box-shadow:
        0 0 0 3px rgba(59,130,246,0.35);

}

/* =========================================
   BOTÕES
========================================= */

button{

    width:100%;

    height:50px;

    border:none;

    border-radius:13px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    transition:0.2s;

}

button:active{

    transform:scale(0.98);

}

.btnPrincipal{

    background:#2563eb;

    color:#fff;

}

.btnPrincipal:hover{

    background:#1d4ed8;

}

.btnPrincipal:disabled{

    opacity:0.5;

    cursor:not-allowed;

}

/* =========================================
   WHATSAPP
========================================= */

.btnWhatsapp{

    margin-top:10px;

    background:#16a34a;

    color:#fff;

}

.btnWhatsapp:hover{

    background:#15803d;

}

/* =========================================
   CARREGANDO
========================================= */

.loader{

    width:20px;

    height:20px;

    border:3px solid rgba(255,255,255,0.3);

    border-top-color:#fff;

    border-radius:50%;

    animation:
        girar 0.8s linear infinite;

    display:inline-block;

    vertical-align:middle;

}

@keyframes girar{

    to{
        transform:rotate(360deg);
    }

}

/* =========================================
   ACESSO LIBERADO
========================================= */

#areaLiberada{

    display:none;

    text-align:center;

}

.iconeLiberado{

    width:75px;

    height:75px;

    border-radius:50%;

    background:#16a34a;

    margin:0 auto 18px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:36px;

}

#areaLiberada h2{

    margin-bottom:10px;

    font-size:21px;

}

#areaLiberada p{

    color:#cbd5e1;

    font-size:14px;

    line-height:1.5;

}

/* =========================================
   OCULTO
========================================= */

.oculto{

    display:none !important;

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================
         ÁREA PRINCIPAL
    ====================================== -->

    <div id="areaPrincipal">


        <div class="icone">
            🔐
        </div>


        <h1>
            Liberação de Escala
        </h1>


        <p class="subtitulo">
            Verificando se sua conta possui
            autorização para acessar as funções
            de criação de escalas.
        </p>


        <!-- USUÁRIO -->

        <div class="usuario">

            <small>
                Usuário conectado
            </small>

            <strong id="nomeUsuario">
                Carregando...
            </strong>

        </div>


        <!-- STATUS -->

        <div
            id="status"
            class="status verificando"
        >

            <span class="loader"></span>

            Verificando autorização...

        </div>


        <!-- =================================
             ÁREA DO CÓDIGO
        ================================== -->

        <div id="areaCodigo">

            <label class="label">

                Digite o código de liberação
                fornecido pelo administrador:

            </label>


            <input
                id="codigo"
                class="inputCodigo"
                type="text"
                inputmode="numeric"
                maxlength="6"
                autocomplete="off"
                placeholder="000000"
            >


            <button
                id="btnConfirmar"
                class="btnPrincipal"
                onclick="confirmarCodigoEscala()"
            >

                Liberar acesso

            </button>


            <button
                class="btnWhatsapp"
                onclick="solicitarCodigo()"
            >

                📱 Não tenho o código

            </button>

        </div>


    </div>


    <!-- =====================================
         ÁREA LIBERADA
    ====================================== -->

    <div id="areaLiberada">


        <div class="iconeLiberado">

            ✓

        </div>


        <h2>
            Acesso liberado
        </h2>


        <p>
            Sua conta está autorizada para
            utilizar as funções de desenvolvedor
            de escalas.
        </p>


    </div>


</div>


<script>

/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const ORIGEM_GITHUB =
    "https://matheus8964.github.io";


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuario = null;


/* =====================================================
   ENVIAR STATUS PARA O GITHUB
===================================================== */

function enviarStatusParaGitHub(status){

    try{

        const mensagem = {

            tipo:
                "STATUS_ACESSO_ESCALA",

            status:
                String(status || "")
                    .toLowerCase(),

            idUsuario:
                usuario &&
                usuario.idUsuario
                    ? String(usuario.idUsuario)
                    : ""

        };


        /*
         * IMPORTANTE:
         *
         * Não usamos window.parent.
         *
         * Como esta página pode estar dentro
         * de vários iframes do Apps Script,
         * window.parent pode apontar para outro
         * domínio do Google.
         *
         * window.top alcança a janela principal
         * do GitHub.
         */

        window.top.postMessage(
            mensagem,
            ORIGEM_GITHUB
        );


        console.log(
            "Status enviado ao GitHub:",
            mensagem
        );

    }catch(erro){

        console.error(
            "Erro ao enviar status:",
            erro
        );

    }

}


/* =====================================================
   OBTER USUÁRIO
===================================================== */

function carregarUsuario(){

    try{

        /*
         * Primeiro tenta localStorage
         */

        const salvo =
            localStorage.getItem("usuario");


        if(salvo){

            usuario =
                JSON.parse(salvo);

        }


        /*
         * Se não encontrou no localStorage,
         * tenta pegar da URL.
         */

        if(!usuario){

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const idUsuario =
                params.get("idUsuario");


            const nome =
                params.get("nome");


            if(idUsuario){

                usuario = {

                    idUsuario:
                        idUsuario,

                    nome:
                        nome || ""

                };


                /*
                 * Salva para as próximas vezes.
                 */

                localStorage.setItem(
                    "usuario",
                    JSON.stringify(usuario)
                );

            }

        }


        /*
         * Se ainda não encontrou usuário
         */

        if(!usuario){

            document.getElementById(
                "nomeUsuario"
            ).textContent =
                "Usuário não identificado";


            alterarStatus(
                "erro",
                "Não foi possível identificar o usuário."
            );


            enviarStatusParaGitHub(
                "block"
            );


            return false;

        }


        /*
         * Mostra nome
         */

        const nome =
            usuario.Nome ||
            usuario.nome ||
            usuario.nomeUsuario ||
            "Usuário";


        document.getElementById(
            "nomeUsuario"
        ).textContent = nome;


        return true;


    }catch(erro){

        console.error(
            "Erro ao carregar usuário:",
            erro
        );


        alterarStatus(
            "erro",
            "Erro ao carregar os dados do usuário."
        );


        enviarStatusParaGitHub(
            "block"
        );


        return false;

    }

}


/* =====================================================
   ALTERAR STATUS VISUAL
===================================================== */

function alterarStatus(tipo, mensagem){

    const elemento =
        document.getElementById("status");


    if(!elemento) return;


    elemento.className =
        "status " + tipo;


    elemento.innerHTML =
        mensagem;

}


/* =====================================================
   VERIFICAR ACESSO
===================================================== */

function verificarAcessoEscala(){

    if(
        !usuario ||
        !usuario.idUsuario
    ){

        enviarStatusParaGitHub(
            "block"
        );

        return;

    }


    alterarStatus(
        "verificando",
        '<span class="loader"></span> Verificando autorização...'
    );


    google.script.run

        .withSuccessHandler(function(resposta){

            console.log(
                "Resposta da verificação:",
                resposta
            );


            /*
             * Usuário autorizado
             */

            if(
                resposta &&
                resposta.sucesso === true &&
                resposta.liberado === true
            ){

                /*
                 * Envia UNBLOCK para o GitHub
                 */

                enviarStatusParaGitHub(
                    "unblock"
                );


                /*
                 * Esconde área principal
                 */

                document.getElementById(
                    "areaPrincipal"
                ).style.display = "none";


                /*
                 * Mostra área liberada
                 */

                document.getElementById(
                    "areaLiberada"
                ).style.display = "block";


                return;

            }


            /*
             * Usuário NÃO autorizado
             */

            enviarStatusParaGitHub(
                "block"
            );


            document.getElementById(
                "areaCodigo"
            ).style.display = "block";


            alterarStatus(
                "erro",
                "Sua conta ainda não possui autorização para criar escalas."
            );


        })

        .withFailureHandler(function(erro){

            console.error(
                "Erro na verificação:",
                erro
            );


            enviarStatusParaGitHub(
                "block"
            );


            alterarStatus(
                "erro",
                "Não foi possível verificar sua autorização."
            );


        })

        .verificarLiberacaoEscala(
            String(usuario.idUsuario)
        );

}


/* =====================================================
   CONFIRMAR CÓDIGO
===================================================== */

function confirmarCodigoEscala(){

    const input =
        document.getElementById(
            "codigo"
        );


    const botao =
        document.getElementById(
            "btnConfirmar"
        );


    const codigo =
        String(
            input.value || ""
        ).trim();


    /*
     * Validação
     */

    if(!/^\d{6}$/.test(codigo)){

        alterarStatus(
            "erro",
            "Digite um código válido com exatamente 6 números."
        );


        input.focus();

        return;

    }


    /*
     * Desabilita botão
     */

    botao.disabled = true;

    botao.innerHTML =
        '<span class="loader"></span> Verificando...';


    alterarStatus(
        "verificando",
        '<span class="loader"></span> Validando código...'
    );


    /*
     * Envia para o Apps Script
     */

    google.script.run

        .withSuccessHandler(function(resposta){

            console.log(
                "Resposta do código:",
                resposta
            );


            /*
             * Código correto
             */

            if(
                resposta &&
                resposta.sucesso === true &&
                resposta.liberado === true
            ){

                /*
                 * O Apps Script agora confirma
                 * novamente a autorização.
                 */

                enviarStatusParaGitHub(
                    "unblock"
                );


                alterarStatus(
                    "sucesso",
                    "Código validado com sucesso."
                );


                /*
                 * Atualiza a tela
                 */

                document.getElementById(
                    "areaCodigo"
                ).style.display = "none";


                document.getElementById(
                    "areaPrincipal"
                ).style.display = "none";


                document.getElementById(
                    "areaLiberada"
                ).style.display = "block";


                return;

            }


            /*
             * Código incorreto
             */

            enviarStatusParaGitHub(
                "block"
            );


            alterarStatus(
                "erro",
                resposta &&
                resposta.mensagem
                    ? resposta.mensagem
                    : "Código inválido."
            );


            botao.disabled = false;

            botao.textContent =
                "Liberar acesso";

        })

        .withFailureHandler(function(erro){

            console.error(
                "Erro ao validar código:",
                erro
            );


            enviarStatusParaGitHub(
                "block"
            );


            alterarStatus(
                "erro",
                "Erro ao validar o código."
            );


            botao.disabled = false;

            botao.textContent =
                "Liberar acesso";

        })

        .verificarCodigoLiberacao(

            String(
                usuario.idUsuario
            ),

            codigo

        );

}


/* =====================================================
   SOLICITAR CÓDIGO PELO WHATSAPP
===================================================== */

function solicitarCodigo(){

    if(!usuario){

        return;

    }


    /*
     * Tenta encontrar o número do administrador
     * em diferentes propriedades.
     */

    let numero =
        usuario.whatsappAdmin ||
        usuario.whatsappAdministrador ||
        usuario.numeroAdmin ||
        "98988554359";


    /*
     * Remove tudo que não for número.
     */

    numero =
        String(numero)
            .replace(/\D/g, "");


    /*
     * Caso seja número brasileiro sem DDI,
     * adiciona 55.
     */

    if(
        numero.length === 11 &&
        numero.startsWith("9")
    ){

        numero =
            "55" + numero;

    }


    const nome =
        usuario.Nome ||
        usuario.nome ||
        usuario.nomeUsuario ||
        "usuário";


    const mensagem =
        "Olá! Sou " +
        nome +
        " e preciso do código de liberação " +
        "para criar escalas.";


    const url =
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(mensagem);


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   SOMENTE NÚMEROS NO CÓDIGO
===================================================== */

document
    .getElementById("codigo")
    .addEventListener(
        "input",
        function(){

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 6);

        }
    );


/* =====================================================
   ENTER PARA CONFIRMAR
===================================================== */

document
    .getElementById("codigo")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                confirmarCodigoEscala();

            }

        }
    );


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

window.addEventListener(
    "load",
    function(){

        /*
         * Primeiro identifica o usuário.
         */

        const identificado =
            carregarUsuario();


        /*
         * Depois verifica autorização.
         */

        if(identificado){

            verificarAcessoEscala();

        }

    }
);

</script>


</body>

</html>

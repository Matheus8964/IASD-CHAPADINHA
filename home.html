<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Escala Distrital"

    href="./icons/icon-192.png"
  >

  <title>
    Escala Distrital - IASD Chapadinha
  </title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html {

      width: 100%;

      min-height: 100%;

      background:
        #f1f5f9;

    }


    body {

      margin: 0;

      padding: 0;

      width: 100%;

      min-height: 100vh;

      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          160deg,
          #0f172a 0%,
          #172554 35%,
          #f1f5f9 35.1%,
          #f1f5f9 100%
        );

      color:
        #0f172a;

      overflow-x:
        hidden;

      padding-top:
        env(safe-area-inset-top);

      padding-bottom:
        env(safe-area-inset-bottom);

      padding-left:
        env(safe-area-inset-left);

      padding-right:
        env(safe-area-inset-right);

    }


    button {

      font-family:
        inherit;

    }


    /* =========================================
       CONTAINER
    ========================================= */

    .app {

      width: 100%;

      max-width: 620px;

      min-height: 100vh;

      min-height: 100dvh;

      margin: 0 auto;

      padding:
        24px
        20px
        calc(30px + env(safe-area-inset-bottom));

      position:
        relative;

    }


    /* =========================================
       CABEÇALHO
    ========================================= */

    .header {

      color:
        white;

      padding:
        8px
        2px
        30px;

    }


    .header-top {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        15px;

    }


    .brand {

      display:
        flex;

      align-items:
        center;

      gap:
        13px;

    }


    .logo {

      width:
        52px;

      height:
        52px;

      min-width:
        52px;

      border-radius:
        16px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        rgba(255,255,255,0.14);

      border:
        1px solid
        rgba(255,255,255,0.18);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      font-size:
        25px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.15);

    }


    .brand-text h1 {

      margin:
        0;

      font-size:
        23px;

      font-weight:
        800;

      letter-spacing:
        -0.5px;

    }


    .brand-text span {

      display:
        block;

      margin-top:
        3px;

      font-size:
        12px;

      color:
        rgba(255,255,255,0.68);

    }


    /* =========================================
       USUÁRIO
    ========================================= */

    .user-card {

      margin-top:
        22px;

      display:
        flex;

      align-items:
        center;

      gap:
        13px;

      padding:
        14px
        16px;

      border-radius:
        18px;

      background:
        rgba(255,255,255,0.10);

      border:
        1px solid
        rgba(255,255,255,0.13);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

    }


    .user-icon {

      width:
        42px;

      height:
        42px;

      min-width:
        42px;

      border-radius:
        50%;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        rgba(255,255,255,0.15);

      font-size:
        20px;

    }


    .user-info {

      min-width:
        0;

      flex:
        1;

    }


    .user-label {

      font-size:
        10px;

      text-transform:
        uppercase;

      letter-spacing:
        1px;

      color:
        rgba(255,255,255,0.58);

    }


    .user-name {

      margin-top:
        3px;

      font-size:
        15px;

      font-weight:
        700;

      color:
        white;

      white-space:
        nowrap;

      overflow:
        hidden;

      text-overflow:
        ellipsis;

    }


    /* =========================================
       CONTEÚDO
    ========================================= */

    .content {

      background:
        rgba(255,255,255,0.97);

      border-radius:
        28px;

      padding:
        22px
        18px
        20px;

      box-shadow:
        0 20px 55px
        rgba(15,23,42,0.16);

      border:
        1px solid
        rgba(255,255,255,0.8);

    }


    /* =========================================
       TÍTULO DA SEÇÃO
    ========================================= */

    .section-title {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      margin-bottom:
        17px;

      padding-left:
        2px;

    }


    .section-title-icon {

      width:
        34px;

      height:
        34px;

      min-width:
        34px;

      border-radius:
        10px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        #eff6ff;

      font-size:
        17px;

    }


    .section-title-text {

      min-width:
        0;

    }


    .section-title-text h2 {

      margin:
        0;

      font-size:
        17px;

      font-weight:
        800;

      letter-spacing:
        -0.2px;

    }


    .section-title-text p {

      margin:
        2px
        0
        0;

      font-size:
        11px;

      color:
        #64748b;

    }


    /* =========================================
       MENU
    ========================================= */

    .menu {

      display:
        flex;

      flex-direction:
        column;

      gap:
        11px;

    }


    .menu-button {

      width:
        100%;

      min-height:
        78px;

      border:
        0;

      border-radius:
        18px;

      padding:
        10px
        13px;

      display:
        flex;

      align-items:
        center;

      text-align:
        left;

      gap:
        13px;

      background:
        #ffffff;

      border:
        1px solid
        #e2e8f0;

      cursor:
        pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;

      box-shadow:
        0 3px 10px
        rgba(15,23,42,0.04);

      position:
        relative;

      overflow:
        hidden;

      appearance:
        none;

      -webkit-appearance:
        none;

    }


    .menu-button::after {

      content:
        "";

      position:
        absolute;

      left:
        0;

      top:
        0;

      bottom:
        0;

      width:
        4px;

      background:
        #2563eb;

      opacity:
        0;

      transition:
        opacity 0.15s ease;

    }


    .menu-button:hover {

      background:
        #f8fafc;

      box-shadow:
        0 7px 18px
        rgba(15,23,42,0.08);

      transform:
        translateY(-1px);

    }


    .menu-button:hover::after {

      opacity:
        1;

    }


    .menu-button:active {

      transform:
        scale(0.985);

      background:
        #f1f5f9;

      box-shadow:
        none;

    }


    .menu-button:focus {

      outline:
        none;

    }


    .menu-button:focus-visible {

      outline:
        3px solid
        rgba(37,99,235,0.25);

      outline-offset:
        2px;

    }


    /* =========================================
       ÍCONES
    ========================================= */

    .menu-icon {

      width:
        50px;

      height:
        50px;

      min-width:
        50px;

      border-radius:
        14px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        22px;

    }


    .icon-disponibilidade {

      background:
        #f0fdf4;

    }


    .icon-solicitacoes {

      background:
        #fff7ed;

    }


    .icon-criar {

      background:
        #eff6ff;

    }


    .icon-ranking {

      background:
        #fefce8;

    }


    .icon-chat {

      background:
        #f5f3ff;

    }


    .menu-info {

      flex:
        1;

      min-width:
        0;

    }


    .menu-title {

      font-size:
        14px;

      font-weight:
        750;

      color:
        #0f172a;

      line-height:
        1.25;

    }


    .menu-description {

      margin-top:
        4px;

      font-size:
        11px;

      line-height:
        1.4;

      color:
        #64748b;

    }


    .arrow {

      width:
        30px;

      height:
        30px;

      min-width:
        30px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        50%;

      background:
        #f8fafc;

      color:
        #64748b;

      font-size:
        18px;

      font-weight:
        600;

    }


    /* =========================================
       LOADING
    ========================================= */

    .loading {

      position:
        fixed;

      inset:
        0;

      z-index:
        9999;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        #0f172a;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;

    }


    .loading.hidden {

      opacity:
        0;

      visibility:
        hidden;

      pointer-events:
        none;

    }


    .loading-content {

      text-align:
        center;

      color:
        white;

    }


    .spinner {

      width:
        38px;

      height:
        38px;

      border-radius:
        50%;

      border:
        3px solid
        rgba(255,255,255,0.18);

      border-top-color:
        white;

      animation:
        girar 0.8s linear infinite;

      margin:
        0
        auto
        14px;

    }


    .loading-text {

      font-size:
        12px;

      color:
        rgba(255,255,255,0.65);

    }


    @keyframes girar {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* =========================================
       BOTÃO CARREGANDO
    ========================================= */

    .menu-button.carregando {

      pointer-events:
        none;

      opacity:
        0.7;

    }


    .menu-button.carregando .arrow {

      animation:
        girar 0.7s linear infinite;

    }


    /* =========================================
       TELAS PEQUENAS
    ========================================= */

    @media (max-width: 380px) {

      .app {

        padding-left:
          14px;

        padding-right:
          14px;

        padding-top:
          18px;

      }


      .header {

        padding-bottom:
          22px;

      }


      .brand-text h1 {

        font-size:
          21px;

      }


      .logo {

        width:
          47px;

        height:
          47px;

        min-width:
          47px;

        font-size:
          22px;

      }


      .content {

        padding:
          19px
          14px
          17px;

        border-radius:
          24px;

      }


      .menu-button {

        min-height:
          72px;

        padding:
          9px
          10px;

        gap:
          10px;

      }


      .menu-icon {

        width:
          43px;

        height:
          43px;

        min-width:
          43px;

        font-size:
          19px;

      }


      .menu-title {

        font-size:
          13px;

      }


      .menu-description {

        font-size:
          10px;

      }

    }


    /* =========================================
       ALTURA PEQUENA
    ========================================= */

    @media (max-height: 700px) {

      .app {

        padding-top:
          14px;

      }


      .header {

        padding-bottom:
          17px;

      }


      .user-card {

        margin-top:
          15px;

      }


      .content {

        padding-top:
          16px;

      }


      .menu {

        gap:
          8px;

      }


      .menu-button {

        min-height:
          65px;

      }

    }


    /* =========================================
       TABLET / DESKTOP
    ========================================= */

    @media (min-width: 700px) {

      body {

        display:
          flex;

        justify-content:
          center;

      }


      .app {

        padding-top:
          40px;

      }


      .header {

        padding-bottom:
          35px;

      }


      .content {

        padding:
          25px
          23px;

      }


      .menu-button {

        min-height:
          82px;

      }


      .menu-title {

        font-size:
          15px;

      }


      .menu-description {

        font-size:
          12px;

      }

    }


    /* =========================================
       ACESSIBILIDADE
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;

      }

    }

  </style>

</head>


<body>


  <!-- =======================================
       CARREGAMENTO
  ======================================== -->

  <div
    class="loading"
    id="loading"
  >

    <div class="loading-content">

      <div class="spinner"></div>

      <div class="loading-text">
        Carregando Escala Distrital...
      </div>

    </div>

  </div>


  <!-- =======================================
       APLICATIVO
  ======================================== -->

  <div class="app">


    <!-- =====================================
         CABEÇALHO
    ====================================== -->

    <header class="header">


      <div class="header-top">


        <div class="brand">


          <div class="logo">
            📅
          </div>


          <div class="brand-text">

            <h1>
              Escala Distrital
            </h1>

            <span>
              IASD Chapadinha
            </span>

          </div>


        </div>


      </div>


      <!-- ===================================
           USUÁRIO
      ==================================== -->

      <div class="user-card">


        <div class="user-icon">
          👤
        </div>


        <div class="user-info">


          <div class="user-label">
            Usuário conectado
          </div>


          <div
            class="user-name"
            id="nomeUsuario"
          >
            Carregando...
          </div>


        </div>


      </div>


    </header>


    <!-- =====================================
         CONTEÚDO
    ====================================== -->

    <main class="content">


      <div class="section-title">


        <div class="section-title-icon">
          📋
        </div>


        <div class="section-title-text">

          <h2>
            Menu principal
          </h2>

          <p>
            Gerencie sua participação nas escalas
          </p>

        </div>


      </div>


      <!-- ===================================
           MENU
      ==================================== -->

      <div class="menu">


        <!-- =================================
             DISPONIBILIDADES
        ================================== -->

        <button
          class="menu-button"
          type="button"
          onclick="abrirPagina('disponibilidade', this)"
        >

          <div
            class="menu-icon icon-disponibilidade"
          >
            📅
          </div>


          <div class="menu-info">

            <div class="menu-title">
              Cadastrar minhas disponibilidades
            </div>

            <div class="menu-description">
              Informe no calendário os dias em que
              você estará disponível para cantar ou pregar.
            </div>

          </div>


          <div class="arrow">
            ›
          </div>

        </button>


        <!-- =================================
             SOLICITAÇÕES
        ================================== -->

        <button
          class="menu-button"
          type="button"
          onclick="abrirPagina('solicitacoes', this)"
        >

          <div
            class="menu-icon icon-solicitacoes"
          >
            🔔
          </div>


          <div class="menu-info">

            <div class="menu-title">
              Solicitações pendentes
            </div>

            <div class="menu-description">
              Aprove ou reprove solicitações
              feitas por outros usuários.
            </div>

          </div>


          <div class="arrow">
            ›
          </div>

        </button>


        <!-- =================================
             CRIAR ESCALA
        ================================== -->

        <button
          class="menu-button"
          type="button"
          onclick="abrirPagina('criarEscala', this)"
        >

          <div
            class="menu-icon icon-criar"
          >
            🗓️
          </div>


          <div class="menu-info">

            <div class="menu-title">
              Espaço para criar escalas
            </div>

            <div class="menu-description">
              Se você tiver permissão, veja cantores
              e pregadores disponíveis em uma determinada data.
            </div>

          </div>


          <div class="arrow">
            ›
          </div>

        </button>


        <!-- =================================
             RANKING
        ================================== -->

        <button
          class="menu-button"
          type="button"
          onclick="abrirPagina('ranking', this)"
        >

          <div
            class="menu-icon icon-ranking"
          >
            🏆
          </div>


          <div class="menu-info">

            <div class="menu-title">
              Ranking de cantores do distrito
            </div>

            <div class="menu-description">
              Veja o ranking de cantores que mais
              se apresentaram nas igrejas do distrito.
            </div>

          </div>


          <div class="arrow">
            ›
          </div>

        </button>


        <!-- =================================
             CHAT
        ================================== -->

        <button
          class="menu-button"
          type="button"
          onclick="abrirPagina('chat', this)"
        >

          <div
            class="menu-icon icon-chat"
          >
            💬
          </div>


          <div class="menu-info">

            <div class="menu-title">
              Chat geral
            </div>

            <div class="menu-description">
              Espaço para todos os usuários
              conversarem e trocarem informações.
            </div>

          </div>


          <div class="arrow">
            ›
          </div>

        </button>


      </div>


    </main>


    <!-- =====================================
         RODAPÉ
    ====================================== -->

    <footer class="footer">

      <strong>
        Escala Distrital IASD Chapadinha
      </strong>

      <br>

      Sistema de gerenciamento de escalas

    </footer>


  </div>


  <!-- =======================================
       JAVASCRIPT
  ======================================== -->

  <script>


    /* =======================================
       CARREGAR USUÁRIO
    ======================================== */

    function carregarUsuario() {


      const params =
        new URLSearchParams(
          window.location.search
        );


      const nomeURL =
        params.get("nome");


      const elemento =
        document.getElementById(
          "nomeUsuario"
        );


      /*
       * =====================================
       * SE RECEBEU NOME PELA URL
       * =====================================
       */

      if (
        nomeURL &&
        nomeURL.trim() !== ""
      ) {


        const nome =
          nomeURL.trim();


        localStorage.setItem(
          "nomeUsuario",
          nome
        );


        if (elemento) {

          elemento.textContent =
            nome;

        }


        /*
         * Remove o parâmetro
         * da URL depois de salvar.
         */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        return;

      }


      /*
       * =====================================
       * BUSCAR NOME SALVO
       * =====================================
       */

      const nomeSalvo =
        localStorage.getItem(
          "nomeUsuario"
        );


      if (elemento) {

        elemento.textContent =
          nomeSalvo ||
          "Usuário";

      }

    }


    /* =======================================
       ABRIR PÁGINA
    ======================================== */

    function abrirPagina(
      pagina,
      botao
    ) {


      const paginas = {


        /*
         * CADASTRAR DISPONIBILIDADES
         */

        disponibilidade:
          "./disponibilidade.html",


        /*
         * SOLICITAÇÕES
         */

        solicitacoes:
          "./solicitacoes.html",


        /*
         * CRIAR ESCALA
         */

        criarEscala:
          "./criarEscala.html",


        /*
         * RANKING
         */

        ranking:
          "./ranking.html",


        /*
         * CHAT
         */

        chat:
          "./chat.html"

      };


      const destino =
        paginas[pagina];


      if (!destino) {

        return;

      }


      /*
       * Efeito visual
       */

      if (botao) {

        botao.classList.add(
          "carregando"
        );

      }


      /*
       * Abrir página
       */

      window.location.href =
        destino;

    }


    /* =======================================
       INICIALIZAÇÃO
    ======================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {


        carregarUsuario();


        const loading =
          document.getElementById(
            "loading"
          );


        if (loading) {

          setTimeout(
            function() {

              loading.classList.add(
                "hidden"
              );

            },
            250
          );

        }

      }
    );


  </script>


</body>

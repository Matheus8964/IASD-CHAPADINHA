<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<meta name="theme-color" content="#0f172a">

<title>Imprimir Escala - Escala Distrital</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #f1f5f9;
}

body {

    padding-top: env(safe-area-inset-top);

    padding-bottom: env(safe-area-inset-bottom);

}


/* =====================================================
   CABEÇALHO
===================================================== */

.header {

    height: 58px;

    background: #0f172a;

    color: white;

    display: flex;

    align-items: center;

    padding: 0 14px;

    gap: 12px;

    position: relative;

    z-index: 10;

}


.btn-voltar {

    border: 0;

    background: rgba(255,255,255,0.12);

    color: white;

    width: 42px;

    height: 42px;

    border-radius: 12px;

    font-size: 22px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

}


.btn-voltar:active {

    transform: scale(0.95);

}


.titulo {

    font-size: 18px;

    font-weight: 700;

}


/* =====================================================
   ÁREA DO IFRAME
===================================================== */

.webview {

    position: absolute;

    top: 58px;

    left: 0;

    width: 100%;

    /*
       58px = cabeçalho
       68px = barra inferior
    */

    height: calc(100vh - 126px);

    border: 0;

    display: block;

    background: white;

}


/* =====================================================
   BARRA INFERIOR
===================================================== */

.bottom-nav {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    height: 68px;

    background: #0f172a;

    display: flex;

    align-items: center;

    justify-content: space-around;

    z-index: 9999;

    padding-bottom: env(safe-area-inset-bottom);

    box-shadow:
        0 -3px 12px rgba(0,0,0,0.18);

}


/* =====================================================
   BOTÕES DA BARRA
===================================================== */

.nav-item {

    flex: 1;

    height: 100%;

    border: 0;

    background: transparent;

    color: #94a3b8;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 3px;

    font-size: 11px;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

}


.nav-item .icone {

    font-size: 23px;

    line-height: 1;

}


.nav-item.ativo {

    color: white;

}


.nav-item:active {

    transform: scale(0.94);

}


/* =====================================================
   AJUSTE PARA CELULARES
===================================================== */

@media (max-width: 480px) {

    .titulo {

        font-size: 17px;

    }

    .nav-item {

        font-size: 10px;

    }

    .nav-item .icone {

        font-size: 22px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header class="header">

    <button
        class="btn-voltar"
        onclick="voltarCriarEscala()"
        aria-label="Voltar"
    >
        ←
    </button>


    <div class="titulo">

        Imprimir minha escala

    </div>

</header>



<!-- =====================================================
     PÁGINA DE IMPRESSÃO
===================================================== -->

<iframe
    class="webview"

    src="https://script.google.com/a/*/macros/s/AKfycbzJh49CVpD4cApIFxo8B-3th3LSAAl6E-i3OEAERwMUwdyjTsjJ5lamwE2iDTSvkowF/exec?page=criarEscala"

    allow="clipboard-read; clipboard-write"

    loading="eager"
></iframe>



<!-- =====================================================
     MENU INFERIOR
===================================================== -->

<nav class="bottom-nav">


    <!-- INÍCIO -->

    <button
        class="nav-item"
        onclick="irParaHome()"
    >

        <span class="icone">
            🏠
        </span>

        <span>
            Início
        </span>

    </button>



    <!-- DISPONIBILIDADE -->

    <button
        class="nav-item"
        onclick="irParaDisponibilidade()"
    >

        <span class="icone">
            📅
        </span>

        <span>
            Disponibilidade
        </span>

    </button>



    <!-- SOLICITAÇÕES -->

    <button
        class="nav-item"
        onclick="irParaSolicitacoes()"
    >

        <span class="icone">
            📩
        </span>

        <span>
            Solicitações
        </span>

    </button>



    <!-- MENU -->

    <button
        class="nav-item ativo"
        onclick="irParaHome()"
    >

        <span class="icone">
            ☰
        </span>

        <span>
            Menu
        </span>

    </button>

</nav>



<script>

/* =====================================================
   DADOS DO USUÁRIO
===================================================== */

function obterDadosUsuario() {

    const idUsuario =
        localStorage.getItem("usuarioId") || "";

    const nome =
        localStorage.getItem("nomeUsuario") || "";

    return {

        idUsuario: idUsuario,

        nome: nome

    };

}


/* =====================================================
   VOLTAR PARA A ÁREA DE CRIAÇÃO DE ESCALA
===================================================== */

function voltarCriarEscala() {

    /*
       Volta para a página de liberação/criação
       de escala.

       O usuário continua dentro do fluxo
       de criação de escala.
    */

    const usuario =
        obterDadosUsuario();


    let url =
        "./criar-escala.html";


    const parametros = [];


    if (usuario.idUsuario) {

        parametros.push(
            "idUsuario=" +
            encodeURIComponent(
                usuario.idUsuario
            )
        );

    }


    if (usuario.nome) {

        parametros.push(
            "nome=" +
            encodeURIComponent(
                usuario.nome
            )
        );

    }


    if (parametros.length > 0) {

        url +=
            "?" +
            parametros.join("&");

    }


    window.location.href = url;

}


/* =====================================================
   INÍCIO
===================================================== */

function irParaHome() {

    const usuario =
        obterDadosUsuario();


    let url =
        "./home.html";


    const parametros = [];


    if (usuario.idUsuario) {

        parametros.push(
            "idUsuario=" +
            encodeURIComponent(
                usuario.idUsuario
            )
        );

    }


    if (usuario.nome) {

        parametros.push(
            "nome=" +
            encodeURIComponent(
                usuario.nome
            )
        );

    }


    if (parametros.length > 0) {

        url +=
            "?" +
            parametros.join("&");

    }


    window.location.href = url;

}


/* =====================================================
   DISPONIBILIDADE
===================================================== */

function irParaDisponibilidade() {

    const usuario =
        obterDadosUsuario();


    let url =
        "./disponibilidade.html";


    const parametros = [];


    if (usuario.idUsuario) {

        parametros.push(
            "idUsuario=" +
            encodeURIComponent(
                usuario.idUsuario
            )
        );

    }


    if (usuario.nome) {

        parametros.push(
            "nome=" +
            encodeURIComponent(
                usuario.nome
            )
        );

    }


    if (parametros.length > 0) {

        url +=
            "?" +
            parametros.join("&");

    }


    window.location.href = url;

}


/* =====================================================
   SOLICITAÇÕES
===================================================== */

function irParaSolicitacoes() {

    const usuario =
        obterDadosUsuario();


    let url =
        "./solicitacoes.html";


    const parametros = [];


    if (usuario.idUsuario) {

        parametros.push(
            "idUsuario=" +
            encodeURIComponent(
                usuario.idUsuario
            )
        );

    }


    if (usuario.nome) {

        parametros.push(
            "nome=" +
            encodeURIComponent(
                usuario.nome
            )
        );

    }


    if (parametros.length > 0) {

        url +=
            "?" +
            parametros.join("&");

    }


    window.location.href = url;

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

window.addEventListener(
    "load",
    function() {

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const idUsuario =
            parametros.get("idUsuario");


        const nome =
            parametros.get("nome");


        /*
           Caso tenha chegado pela URL,
           mantém os dados do usuário.
        */

        if (idUsuario) {

            localStorage.setItem(
                "usuarioId",
                idUsuario
            );

        }


        if (nome) {

            localStorage.setItem(
                "nomeUsuario",
                nome
            );

        }

    }
);

</script>


</body>

</html>

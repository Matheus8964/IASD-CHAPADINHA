<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Ranking de Cantores</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    min-height: 100%;

}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

}


.card {

    width: 100%;

    max-width: 450px;

    padding: 35px 25px;

    text-align: center;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 20px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.30);

    backdrop-filter:
        blur(15px);

}


.icone {

    font-size: 55px;

    margin-bottom: 20px;

}


h1 {

    font-size: 24px;

    margin-bottom: 12px;

}


p {

    color: #cbd5e1;

    font-size: 15px;

    line-height: 1.6;

}


.aviso {

    margin-top: 25px;

    padding: 12px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.08);

    font-size: 13px;

    color: #e2e8f0;

}

</style>

</head>


<body>


<div class="card">

    <div class="icone">
        🏆
    </div>

    <h1>
        Ranking de Cantores
    </h1>

    <p>
        Em breve essa função será liberada.
    </p>

    <div class="aviso">
        Aguarde as próximas atualizações
        do sistema.
    </div>

</div>


</body>

</html>

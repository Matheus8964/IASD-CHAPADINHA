<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">

<title>Escala</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: white;

}


/* =====================================================
   WEBVIEW
===================================================== */

.webview {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    display: block;

    background: white;

}

</style>

</head>


<body>


<!-- =====================================================
     TELA WEBVIEW
===================================================== -->

<iframe

    class="webview"

    src="https://script.google.com/a/*/macros/s/AKfycbzJh49CVpD4cApIFxo8B-3th3LSAAl6E-i3OEAERwMUwdyjTsjJ5lamwE2iDTSvkowF/exec?page=printEscala"

    allow="clipboard-read; clipboard-write"

    loading="eager"

></iframe>


<script>

/* =====================================================
   PEGAR DADOS DO USUÁRIO
===================================================== */

window.addEventListener("load", function() {

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const idUsuario =
        parametros.get("idUsuario");


    const nome =
        parametros.get("nome");


    /*
     * Salva os dados do usuário
     * quando recebidos pela URL.
     */

    if (idUsuario) {

        localStorage.setItem(
            "usuarioId",
            idUsuario
        );

    }


    if (nome) {

        localStorage.setItem(
            "nomeUsuario",
            nome
        );

    }

});

</script>


</body>

</html>
